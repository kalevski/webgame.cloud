name: Publish web build

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'api/src/contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/publish-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require the API URL to be configured
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "set the repository variable VITE_API_URL to the deployed API origin" >&2
            exit 1
          fi

      - name: Build web
        run: npm run build -w @webgame-cloud/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ANALYTICS_SRC: ${{ vars.VITE_ANALYTICS_SRC }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ vars.VITE_ANALYTICS_WEBSITE_ID }}
          VITE_ANALYTICS_DOMAIN: ${{ vars.VITE_ANALYTICS_DOMAIN }}

      - name: Push build to `public` (single commit)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web/build
          branch: public
          single-commit: true
          commit-message: 'publish web build from ${{ github.sha }}'
